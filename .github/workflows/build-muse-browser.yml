name: Build MuseBrowser IPA

on:
  push:
    paths:
      - "browser-app/**"
      - ".github/workflows/build-muse-browser.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Download Babel standalone
        run: |
          cd browser-app/MuseBrowser
          (curl -fsSL --max-time 120 https://unpkg.com/@babel/standalone@7.26.4/babel.min.js -o babel.min.js \
            || curl -fsSL --max-time 120 https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js -o babel.min.js)
          ls -la babel.min.js
          head -c 100 babel.min.js

      - name: Archive (unsigned, for TrollStore)
        run: |
          xcodebuild \
            -project browser-app/MuseBrowser.xcodeproj \
            -scheme MuseBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MuseBrowser.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          APP_PATH="$RUNNER_TEMP/MuseBrowser.xcarchive/Products/Applications/MuseBrowser.app"
          ls -la "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr MuseBrowser.ipa Payload
          ls -la MuseBrowser.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuseBrowser-ipa
          path: ${{ runner.temp }}/MuseBrowser.ipa
          retention-days: 14

      - name: Publish to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="musebrowser-build-${{ github.run_number }}"
          gh release create "$TAG" "${{ runner.temp }}/MuseBrowser.ipa" \
            --title "MuseBrowser $TAG" \
            --notes "TrollStore 直装包"
